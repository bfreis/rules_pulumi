name: Tag and Release

on:
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Custom version tag (e.g. 1.0.0). Leave empty for auto-bump."
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Bazel repository
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-ubuntu-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: bazel-ubuntu-

      - name: Build all targets
        run: bazel build //...

      - name: Integration tests
        run: cd test && bazel test //... --test_output=errors

  tag:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          custom_tag: ${{ inputs.custom_tag }}

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true

      - name: Get release tag
        run: echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV

      - name: Get repo name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Create source archive
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          exclusions: '*.git* /*node_modules/* .editorconfig /bazel-*'

      - name: Upload source archive
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          allowUpdates: true
          artifacts: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"

  publish-bcr:
    needs: tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets: inherit
