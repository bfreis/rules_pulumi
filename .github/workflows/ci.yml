name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Bazel repository
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-ubuntu-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'test/MODULE.bazel', 'test/MODULE.bazel.lock') }}
          restore-keys: bazel-ubuntu-

      - name: Build all targets
        run: bazel build //...

      - name: Integration tests
        run: cd test && bazel test //... --test_output=errors

  test-macos:
    # Tags, plus on demand. The gate cannot be dropped to workflow_dispatch
    # alone: dispatching runs against a branch ref, so a tags-only condition
    # skips the job and reports the run green without having built anything.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Bazel repository
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/bazel
          key: bazel-macos-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'test/MODULE.bazel', 'test/MODULE.bazel.lock') }}
          restore-keys: bazel-macos-

      - name: Build all targets
        run: bazel build //...

      - name: Integration tests
        run: cd test && bazel test //... --test_output=errors
